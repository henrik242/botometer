name: Bygg APK

# Sideloading har ingen distribusjonskanal, så CI ER kanalen. Hver push bygger og tester,
# og legger APK-en ved kjøringen som artefakt.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Jobben laster bare opp en artefakt, og trenger ikke skrivetilgang til repoet.
    permissions:
      contents: read
    steps:
      # Hele historikken: versionCode er antall commits, og en grunn klone gir alltid 1.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Test satstabellen
        run: ./gradlew :app:test

      - name: Bygg release-APK og AAB
        env:
          # Legg inn en egen keystore som secrets hvis du vil dele appen videre. Uten dem
          # signeres den med debug-nøkkelen: installerbar, men beviser ingenting om opphav.
          BOTOMETER_KEYSTORE_BASE64: ${{ secrets.BOTOMETER_KEYSTORE_BASE64 }}
          BOTOMETER_KEYSTORE_PASSWORD: ${{ secrets.BOTOMETER_KEYSTORE_PASSWORD }}
          BOTOMETER_KEY_ALIAS: ${{ secrets.BOTOMETER_KEY_ALIAS }}
          BOTOMETER_KEY_PASSWORD: ${{ secrets.BOTOMETER_KEY_PASSWORD }}
        run: |
          # Array, ikke streng: et passord med mellomrom eller glob-tegn ville blitt delt opp
          # av ordsplittingen og gitt et signeringsbrudd som ser ut som feil passord.
          ARGS=()
          if [ -n "$BOTOMETER_KEYSTORE_BASE64" ]; then
            echo "$BOTOMETER_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/botometer.jks"
            ARGS=(-Pbotometer.keystore="$RUNNER_TEMP/botometer.jks"
                  -Pbotometer.keystorePassword="$BOTOMETER_KEYSTORE_PASSWORD"
                  -Pbotometer.keyAlias="$BOTOMETER_KEY_ALIAS"
                  -Pbotometer.keyPassword="$BOTOMETER_KEY_PASSWORD")
          else
            echo "::warning::Ingen keystore-secrets. APK-en signeres med en tilfeldig debug-nokkel og kan ikke oppdatere en tidligere installasjon."
          fi
          # Både APK og AAB. APK-en er nok for DHU og for Internal App Sharing, som tar imot
          # begge deler. Et internt testspor krever derimot en AAB - og da også en fast
          # keystore, se advarselen over: en ny tilfeldig debug-nøkkel pr. kjøring blir avvist
          # ved andre opplasting.
          ./gradlew :app:assembleRelease :app:bundleRelease "${ARGS[@]}"

      # archive: false laster opp filen som den er i stedet for pakket i en zip, så den kan
      # lastes rett ned på telefonen. Krever nøyaktig én fil: *.apk treffer bare APK-en, ikke
      # output-metadata.json ved siden av. Filnavnet bærer kortshaen, og artefakten arver det,
      # så nedlastingen sier selv hvilken commit den er.
      - uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/release/*.apk
          archive: false

      # AAB-en lastes ikke ned og installeres på telefonen - den lastes opp til Play. Den er med
      # fordi et internt testspor ikke tar imot APK.
      - uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/bundle/release/*.aab
          archive: false
